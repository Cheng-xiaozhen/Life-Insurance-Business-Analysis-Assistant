<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="聊天式寿险经营数据分析工作台" />
    <title>寿险经营分析助手</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/assets/app.js" type="module"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="会话与模板">
        <header class="sidebar-header">
          <a class="brand" href="/" aria-label="寿险经营分析助手首页">
            <span class="brand-mark" aria-hidden="true">寿</span>
            <span>经营分析助手</span>
          </a>
          <button class="new-chat-button" id="new-chat-button" type="button">新建分析</button>
        </header>

        <section class="sidebar-section template-section">
          <label for="template-select">报告模板</label>
          <select id="template-select" disabled>
            <option>正在加载模板...</option>
          </select>
          <p id="template-path">模板加载后显示文件路径</p>
          <div class="template-meta" aria-label="模板信息">
            <span><strong id="section-count">0</strong> 个章节</span>
            <span><strong id="step-count">0</strong> 个步骤</span>
          </div>
        </section>

        <nav class="conversation-nav" aria-label="分析会话">
          <p>当前会话</p>
          <button class="conversation-item active" type="button">
            <span id="conversation-title">新的经营分析</span>
            <small id="conversation-state">等待提问</small>
          </button>
        </nav>

        <footer class="sidebar-footer">
          <div class="service-state" id="service-state" role="status">
            <span class="state-dot" aria-hidden="true"></span>
            <span>正在连接服务</span>
          </div>
          <small>AI 生成内容请结合业务口径复核</small>
        </footer>
      </aside>

      <main class="chat-workspace">
        <header class="chat-header">
          <div>
            <h1>数据分析助手</h1>
            <p id="chat-context">选择模板后开始分析</p>
          </div>
          <span class="model-label">模板驱动分析</span>
        </header>

        <div class="chat-scroll" id="chat-scroll" aria-live="polite">
          <section class="welcome" id="welcome" aria-labelledby="welcome-title">
            <span class="assistant-mark" aria-hidden="true">寿</span>
            <h2 id="welcome-title">今天想分析什么？</h2>
            <p>选择左侧模板，我会依次查询数据并生成结构化经营分析报告。</p>
            <button class="suggestion" id="suggestion-button" type="button" disabled>
              生成月度经营分析报告
            </button>
          </section>

          <section class="conversation" id="conversation" hidden>
            <div class="message user-message">
              <div class="message-column">
                <span class="message-author">你</span>
                <p id="user-message-text"></p>
              </div>
            </div>

            <div class="message assistant-message">
              <span class="assistant-mark compact" aria-hidden="true">寿</span>
              <div class="message-column">
                <span class="message-author">经营分析助手</span>
                <p class="assistant-intro" id="assistant-intro">我会按照模板依次执行分析步骤。</p>

                <details class="process-details" id="process-details" open>
                  <summary>
                    <span id="pipeline-title">准备分析</span>
                    <strong id="progress-count">0 / 0</strong>
                  </summary>
                  <div class="step-list" id="timeline"></div>
                </details>

                <p class="form-message" id="form-message" role="alert" hidden></p>
                <article class="report-content" id="report-content" hidden></article>
                <div class="report-actions" id="report-actions" hidden>
                  <button id="copy-button" type="button">复制报告</button>
                  <button id="download-button" type="button">下载 Markdown</button>
                </div>
              </div>
            </div>
          </section>
        </div>

        <footer class="composer-area">
          <form class="composer" id="composer">
            <label class="sr-only" for="prompt-input">分析指令</label>
            <textarea
              id="prompt-input"
              rows="1"
              placeholder="输入分析指令"
              aria-describedby="composer-help"
            ></textarea>
            <button id="send-button" type="submit" disabled>发送</button>
          </form>
          <p id="composer-help">当前会话将按照左侧所选模板执行分析</p>
        </footer>
      </main>
    </div>
  </body>
</html>
