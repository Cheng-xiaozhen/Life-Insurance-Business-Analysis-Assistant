[project]
name = "life-insurance-business-analysis-assistant"
version = "0.1.0"
description = "AI service for life insurance business analysis"
readme = "README.md"
authors = [
    { name = "Cheng-xiaozhen", email = "1075527224@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.15",
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "mypy>=2.3.1",
    "omegaconf>=2.3.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
life-insurance-business-analysis-assistant = "life_insurance_business_analysis_assistant.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["life_insurance_business_analysis_assistant"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
]
