场景名称: 价值经营检视
场景编码: value_review
渠道类型: 个险
时间维度: 月度
分析对象: 机构
分析目的: 经营检视
触发关键词:
- 价值
- 价值达成
- 价值达成率
- 价值进度
- 价值同比
- 价值怎么样
- 价值分析
分析思路:
- 步骤序号: 1
  分析步骤: 统计全系统的价值达成、价值达成率、价值同比、全年价值进度、全年价值同比。
  指标:
  - 价值达成
  - 价值达成率
  - 价值同比
  - 全年价值进度
  - 全年价值同比
  分析模式: 直接查询
- 步骤序号: 2
  分析步骤: 筛选价值达成率严格高于85%的机构，列出机构名称及达成率并统计机构数量。
  指标:
  - 价值达成率
  分析模式: 条件筛选
- 步骤序号: 3
  分析步骤: 筛选价值达成率严格低于55%的机构，列出机构名称及达成率并统计机构数量。
  指标:
  - 价值达成率
  分析模式: 条件筛选
