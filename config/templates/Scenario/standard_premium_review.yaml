场景名称: 标保经营检视
场景编码: standard_premium_review
渠道类型: 个险
时间维度: 月度
分析对象: 机构
分析目的: 经营检视
触发关键词:
- 标保
- 标保达成
- 标保达成率
- 标保进度
- 标保同比
- 标保怎么样
- 标保分析
分析思路:
- 步骤序号: 1
  分析步骤: 统计全系统的标保达成、标保达成率、标保同比、全年标保达成、全年标保进度、全年标保同比。
  指标:
  - 标保达成
  - 标保达成率
  - 标保同比
  - 全年标保达成
  - 全年标保进度
  - 全年标保同比
  分析模式: 直接查询
- 步骤序号: 2
  分析步骤: 筛选标保达成率严格高于70%的机构，列出机构名称及达成率并统计机构数量。
  指标:
  - 标保达成率
  分析模式: 条件筛选
- 步骤序号: 3
  分析步骤: 筛选标保达成率严格低于50%的机构，列出机构名称及达成率并统计机构数量。
  指标:
  - 标保达成率
  分析模式: 条件筛选
- 步骤序号: 4
  分析步骤: 筛选全年标保进度严格高于60%的机构，列出机构名称及进度并统计机构数量。
  指标:
  - 全年标保进度
  分析模式: 条件筛选
- 步骤序号: 5
  分析步骤: 筛选全年标保进度严格低于45%的机构，列出机构名称及进度并统计机构数量。
  指标:
  - 全年标保进度
  分析模式: 条件筛选
