场景:
  - 场景名称: 标保经营检视
    场景编码: standard_premium_review

    渠道类型: 个险
    时间维度: 月度
    分析对象: 机构
    分析目的: 经营检视

    触发关键词:
      - 标保
      - 标保达成
      - 标保达成率
      - 标保进度
      - 标保同比
      - 标保怎么样
      - 标保分析

    输入参数:
      年份:
        说明: 分析数据所属年份
        类型: integer
        必填: true

      月份:
        说明: 分析数据所属月份
        类型: integer
        必填: true
        最小值: 1
        最大值: 12

      渠道:
        说明: 本次分析的业务渠道
        类型: string
        必填: true
        默认值: 个险

      机构范围:
        说明: 本次分析覆盖的机构，如全系统、北京分公司
        类型: string
        必填: true
        默认值: 全系统

    分析思路:
      - 步骤序号: 1
        分析步骤: >-
          获取{{年份}}年{{月份}}月，{{渠道}}渠道、{{机构范围}}范围的总体数据。
          其中，标保达成、标保达成率、标保同比使用所选月份的月度口径；
          全年标保达成、全年标保进度、全年标保同比使用本年截至所选月份的年度累计口径，
          具体指标计算口径以问数 API 为准，不解释为尚未结束的整年最终数据。
          根据返回的总体指标值生成分析结论，分别说明月度表现和年度累计表现。
        指标:
          - 标保达成
          - 标保达成率
          - 标保同比
          - 全年标保达成
          - 全年标保进度
          - 全年标保同比
        分析模式: 直接查询
        取数参数:
          年份: "{{年份}}"
          月份: "{{月份}}"
          渠道: "{{渠道}}"
          机构范围: "{{机构范围}}"

      - 步骤序号: 2
        分析步骤: >-
          获取{{年份}}年{{月份}}月，{{渠道}}渠道、{{机构范围}}范围内各机构的月度标保达成率明细。
          由 LLM 筛选标保达成率严格高于70%的机构，列出机构名称及达成率，统计符合条件的机构数量并生成分析结论。
          若没有符合条件的机构，明确说明数量为0。
        指标:
          - 标保达成率
        分析模式: 条件筛选
        取数参数:
          年份: "{{年份}}"
          月份: "{{月份}}"
          渠道: "{{渠道}}"
          机构范围: "{{机构范围}}"

      - 步骤序号: 3
        分析步骤: >-
          获取{{年份}}年{{月份}}月，{{渠道}}渠道、{{机构范围}}范围内各机构的月度标保达成率明细。
          由 LLM 筛选标保达成率严格低于50%的机构，列出机构名称及达成率，统计符合条件的机构数量并生成分析结论。
          若没有符合条件的机构，明确说明数量为0。
        指标:
          - 标保达成率
        分析模式: 条件筛选
        取数参数:
          年份: "{{年份}}"
          月份: "{{月份}}"
          渠道: "{{渠道}}"
          机构范围: "{{机构范围}}"

      - 步骤序号: 4
        分析步骤: >-
          获取{{年份}}年截至{{月份}}月，{{渠道}}渠道、{{机构范围}}范围内各机构的全年标保进度明细。
          全年标保进度采用本年截至所选月份的年度累计口径，具体指标计算口径以问数 API 为准。
          由 LLM 筛选全年标保进度严格高于60%的机构，列出机构名称及进度，统计符合条件的机构数量并生成分析结论。
          若没有符合条件的机构，明确说明数量为0。
        指标:
          - 全年标保进度
        分析模式: 条件筛选
        取数参数:
          年份: "{{年份}}"
          月份: "{{月份}}"
          渠道: "{{渠道}}"
          机构范围: "{{机构范围}}"

      - 步骤序号: 5
        分析步骤: >-
          获取{{年份}}年截至{{月份}}月，{{渠道}}渠道、{{机构范围}}范围内各机构的全年标保进度明细。
          全年标保进度采用本年截至所选月份的年度累计口径，具体指标计算口径以问数 API 为准。
          由 LLM 筛选全年标保进度严格低于45%的机构，列出机构名称及进度，统计符合条件的机构数量并生成分析结论。
          若没有符合条件的机构，明确说明数量为0。
        指标:
          - 全年标保进度
        分析模式: 条件筛选
        取数参数:
          年份: "{{年份}}"
          月份: "{{月份}}"
          渠道: "{{渠道}}"
          机构范围: "{{机构范围}}"


