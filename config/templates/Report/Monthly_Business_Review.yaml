报告编码: Monthly_Business_Review
报告名称: 月度经营分析
渠道类型: 个险
时间维度: 月度
分析对象: 全系统
分析目的: 经营检视
章节板块:
- 分析逻辑: 查询全系统的标保达成、标保达成率、标保同比。
  关联指标:
  - 标保达成
  - 标保达成率
  - 标保同比
  分析模式: 直接查询
  板块名称: 标保概况
  子板块: []
- 分析逻辑: 按子板块展开人力经营情况：每个主题先给全系统总体数据，再按阈值对机构分类，输出优秀与预警名单。
  关联指标: []
  分析模式: ''
  板块名称: 人力概况
  子板块:
  - 子板块名称: 活动人力
    分析步骤:
    - 步骤序号: 1
      分析步骤: 查询全系统的活动人力、活动人力达成率、活动人力同比
      关联指标:
      - 活动人力
      - 活动人力达成率
      - 活动人力同比
      分析模式: 直接查询
    - 步骤序号: 2
      分析步骤: 查询活动人力达成率高于90%的机构
      关联指标:
      - 活动人力达成率
      分析模式: 条件筛选
    - 步骤序号: 3
      分析步骤: 查询活动人力达成率低于60%的机构
      关联指标:
      - 活动人力达成率
      分析模式: 条件筛选
  - 子板块名称: 阳关人力
    分析步骤:
    - 步骤序号: 1
      分析步骤: 查询全系统的阳光人力、阳光人力达成率、阳光人力同比。
      关联指标:
      - 阳光人力
      - 阳光人力达成率
      - 阳光人力同比
      分析模式: 直接查询
    - 步骤序号: 2
      分析步骤: 查询阳光人力达成率高于90%的机构。
      关联指标:
      - 阳光人力达成率
      分析模式: 条件筛选
    - 步骤序号: 3
      分析步骤: 查询阳光人力达成率低于70%的机构。
      关联指标:
      - 阳光人力达成率
      分析模式: 条件筛选
写作风格与格式要求:
  语气风格: 使用规范的业务分析语言，避免口语化、聊天式表达。以数据和事实为依据，避免主观情绪和没有数据支撑的判断。避免大量重复描述指标，突出真正值得关注的信息。
  结论风格: 采用总—分结构，先给分析结论，再给数据依据。客观数据总结，不进行原因分析和主观评价。
  单位规则: 金额单位万元；百分比保留1位小数；
  句式示例:
  - -全系统标保达成12444万元，标保达成率61.8%，标保同比负增11.6%；全年标保达成100538万元，全年标保进度53.8%，全年标保同比正增20.6%。
  - -标保达成率高于70%的机构共9家，分别为新疆、天津、潍坊、云南、海南、河南、内蒙古、宁波和甘肃。
  - -标保达成率低于50%的机构共有8家，分别为：贵州、安徽、山西、上海、青岛、宁夏、北京、深圳。
